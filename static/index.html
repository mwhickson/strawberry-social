<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strawberry Social</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Characters & Sessions -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🍓 Strawberry Social</h2>
                <p class="subtitle">Lightweight AI Chat</p>
            </div>

            <div class="sidebar-action-bar">
                <button id="upload-btn" class="action-btn">+ Upload Card</button>
                <input type="file" id="file-input" accept=".json,.png" style="display: none;">
            </div>

            <div class="section-title">Character Roster</div>
            <div id="character-list" class="roster-list">
                <div class="loading-text">Loading characters...</div>
            </div>

            <div class="section-title">Chat Sessions</div>
            <div id="session-list" class="session-list">
                <div class="loading-text">No active sessions.</div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="chat-header-actions">
                    <span id="current-chat-title">Select a character to start chatting</span>
                    <button id="profile-btn" class="profile-toggle-btn" style="display: none;" title="View Character Profile">ℹ️ Profile</button>
                </div>
            </header>

            <div id="chat-messages" class="chat-messages">
                <div class="welcome-banner">
                    <h3>Welcome to Strawberry Social</h3>
                    <p>Select a character card from your <code>/characters</code> folder using the sidebar to begin.</p>
                </div>
            </div>

            <footer class="chat-input-area">
                <form id="chat-form" class="chat-form">
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type a message..."
                        autocomplete="off"
                        disabled
                    >
                    <button type="submit" id="send-btn" disabled>Send</button>
                </form>
            </footer>
        </main>
    </div>

    <div id="profile-overlay" class="profile-overlay"></div>
    <div id="profile-drawer" class="profile-drawer">
        <div class="drawer-header">
            <h2 id="drawer-name">Character Name</h2>
            <button id="close-drawer-btn" class="close-btn">&times;</button>
        </div>
        <div class="drawer-body" id="drawer-body-content">
            <!-- Populated dynamically -->
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
