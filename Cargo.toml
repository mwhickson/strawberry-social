[package]
name = "strawberry-social"
version = "0.1.0"
edition = "2021"
authors = ["Strawberry Social Team"]
description = "Lightweight, local-first LLM character chat client"

[dependencies]
# Web Framework & Async Runtime
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
rust-embed = "8.4"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP Client (for local llama.cpp/Koboldcpp calls)
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"

# Database & Memory
rusqlite = { version = "0.31", features = ["bundled"] }

# Image & Base64 processing (Card metadata extraction)
image = "0.25"
base64 = "0.22"

# Utilities
tracing = "0.1"
tracing-subscriber = "0.3"
open = "5.1"