name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: strawberry-social
            archive_name: strawberry-social-linux-x86_64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-gnu
            bin_name: strawberry-social.exe
            archive_name: strawberry-social-windows-x86_64.zip

          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: strawberry-social
            archive_name: strawberry-social-macos-x86_64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: strawberry-social
            archive_name: strawberry-social-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Linux/macOS Archive
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/
          cp config.yaml dist/
          tar -czvf ${{ matrix.archive_name }} -C dist .

      - name: Prepare Windows Archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/
          Copy-Item config.yaml dist/
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
